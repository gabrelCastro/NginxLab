services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nginxlearn
      POSTGRES_USER: nginxlearn
      POSTGRES_PASSWORD: nginxlearn
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nginxlearn-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nginxlearn -d nginxlearn"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nginxlearn-postgres:
