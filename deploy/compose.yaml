# Produção em um host: docker compose --env-file .env up -d --build
# Exponha apenas o serviço web (porta WEB_PORT). Banco, API e métricas ficam na rede interna.
name: nginxlearn

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nginxlearn
      POSTGRES_USER: nginxlearn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nginxlearn -d nginxlearn"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ../apps/api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/nginxlearn
      SPRING_DATASOURCE_USERNAME: nginxlearn
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod

  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8088}:8080"

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/backup/loop.sh"]
    environment:
      PGHOST: db
      PGUSER: nginxlearn
      PGDATABASE: nginxlearn
      PGPASSWORD: ${POSTGRES_PASSWORD}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./backup:/backup:ro
      - ${BACKUP_PATH:-./backups}:/backups

volumes:
  db_data:
