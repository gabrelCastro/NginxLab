# Front-end estático e proxy para a API na mesma origem (sem CORS).
# TLS: termine HTTPS num balanceador ou adicione listen 443 ssl aqui; veja docs/DEPLOY.md.

# rid= é o mesmo X-Request-Id repassado à API (campo requestId nos logs JSON dela).
log_format nginxlearn '$remote_addr [$time_local] "$request" $status $body_bytes_sent $request_time rid=$request_id';
access_log /var/log/nginx/access.log nginxlearn;

limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
limit_req_status 429;

upstream nginxlearn_api {
    server api:8080;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Arquivos com hash no nome podem ficar em cache para sempre.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=api_per_ip burst=40 nodelay;
        proxy_pass http://nginxlearn_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # Métricas e saúde da API ficam na rede interna; nada de /actuator aqui.
    location /actuator/ {
        return 404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
