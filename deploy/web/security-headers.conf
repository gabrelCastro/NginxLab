# Cabeçalhos de segurança do front-end. Incluído em cada location do nginx (add_header
# não é herdado quando a location define outro) e aplicado também por
# scripts/serve-dist.mjs, para que os E2E falhem se algo violar a CSP.
#
# - Scripts: apenas os arquivos do próprio site; nada inline, nada de terceiros.
# - Estilos inline: a loja simulada é um iframe srcdoc com <style>, e o srcdoc herda a CSP.
# - Imagens data:: a imagem da loja vem da resposta simulada como data URI.
# - Fontes data:: o Vite embute subconjuntos pequenos das fontes no CSS.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
