name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      # Inclui o contrato do simulador com o backend Java (fidelity/serverContract.test.ts).
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run e2e

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Testcontainers usa o Docker do runner.
      - run: ./mvnw -B test

  stack:
    needs: [verify, api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Sobe nginx, API e PostgreSQL
        working-directory: deploy
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 24)/" .env
          docker compose --env-file .env up -d --build --wait
      - run: npm run e2e:stack
        env:
          NGINXLEARN_STACK_URL: http://127.0.0.1:8088
      - name: Ensaia backup e restauração
        working-directory: deploy
        run: |
          docker compose exec -T backup /backup/backup.sh
          dump=$(docker compose exec -T backup sh -c 'ls -1t /backups/*.dump | head -1')
          docker compose exec -T backup sh -c "createdb restore_check && PGDATABASE=restore_check /backup/restore.sh $dump && psql -d restore_check -tAc 'select count(*) from learners' | grep -qv '^0$'"
      - if: failure()
        working-directory: deploy
        run: docker compose logs --no-color
      - if: always()
        working-directory: deploy
        run: docker compose down -v

  fidelity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: docker pull nginx:1.27-alpine
      - run: npm run fidelity:record
      - run: git diff --exit-code -- fidelity/recorded
